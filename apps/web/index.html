<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergyManager</title>
    <!-- Behind Cloudflare Access the whole hostname needs a session cookie.
         Unlike a navigation, a script, or a stylesheet, a manifest link is
         fetched without credentials by default even for a same-origin URL —
         `use-credentials` is what makes it carry the Access cookie, the same
         way visiting /manifest.json directly in the address bar already did. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Before anything renders: the theme lives in this browser, and
         applying it from React would paint a light page first and switch
         it a frame later. Same key as src/lib/theme.tsx. -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem("em.theme");
          var dark =
            choice === "dark" ||
            ((choice === null || choice === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* No storage: light it is. */
        }
      })();
    </script>
    <!-- iOS never reads the manifest for these: without its own tags, an
         icon added to the home screen opens back inside Safari's UI chrome
         rather than standalone, and the status bar sits at Safari's default
         instead of matching the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EnergyManager" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
