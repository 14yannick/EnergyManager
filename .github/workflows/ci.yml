name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose. The action reads the pnpm version from
      # the "packageManager" field in package.json, and specifying both is a
      # hard error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must come before lint/typecheck/test: apps import @energy-manager/shared
      # through its "main"/"types" entries, which point into dist/. dist/ is
      # gitignored, so a fresh checkout has nothing to resolve against and tsc
      # fails with TS2307. Locally this passes only if a stale dist is lying
      # around. The Dockerfiles already build shared first for the same reason.
      - run: pnpm --filter @energy-manager/shared build

      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm --filter @energy-manager/api build
      - run: pnpm --filter @energy-manager/web build
      - run: pnpm --filter @energy-manager/api test
