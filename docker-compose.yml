# The deployable stack: api + web, pointed at an existing PostgreSQL/TimescaleDB
# via DATABASE_URL. No database service here on purpose — the server already
# runs one, and starting a second would silently give the app an empty database
# to write into. For a throwaway database (fresh clone, CI), add the optional
# override: docker compose -f docker-compose.yml -f docker-compose.local-db.yml up
services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PORT: 3000
      # Polling settings. These are the reason to run on a server at all: BKW
      # publishes a rolling ~25h window with no history endpoint, so a rate not
      # captured while the app was down is gone for good.
      BKW_SYNC_ENABLED: ${BKW_SYNC_ENABLED:-true}
      BKW_SYNC_INTERVAL_MINUTES: ${BKW_SYNC_INTERVAL_MINUTES:-30}
      # Home Assistant. HA_URL unset disables the integration *silently*, so if
      # HA data stops arriving after a deploy, check these reached the container.
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_SYNC_ENABLED: ${HA_SYNC_ENABLED:-true}
      HA_SYNC_INTERVAL_MINUTES: ${HA_SYNC_INTERVAL_MINUTES:-15}
      HA_SYNC_LOOKBACK_HOURS: ${HA_SYNC_LOOKBACK_HOURS:-48}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Unraid's own UI owns 80, and 8080 collides with a lot of community apps.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
