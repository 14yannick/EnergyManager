# The deployable stack: api + web, pointed at an existing PostgreSQL/TimescaleDB
# via DATABASE_URL. No database service here on purpose — the server already
# runs one, and starting a second would silently give the app an empty database
# to write into. For a throwaway database (fresh clone, CI), add the optional
# override: docker compose -f docker-compose.yml -f docker-compose.local-db.yml up
services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PORT: 3000
      # Home Assistant. HA_URL unset disables the integration *silently*, so if
      # HA data stops arriving after a deploy, check these reached the container.
      # Dynamic feed-in rates ride on this same sync; no history endpoint
      # exists, so a rate not captured while this was down is gone for good.
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_SYNC_ENABLED: ${HA_SYNC_ENABLED:-true}
      HA_SYNC_INTERVAL_MINUTES: ${HA_SYNC_INTERVAL_MINUTES:-15}
      HA_SYNC_LOOKBACK_HOURS: ${HA_SYNC_LOOKBACK_HOURS:-48}
      # Authentication. These were missing, which meant the container always
      # ran with auth off — and off means every request is treated as admin,
      # whatever Cloudflare Access decided at the door. AUTH_DEV_AS is local
      # only; the API refuses to start if it is set while AUTH_ENABLED=true.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_DEV_AS: ${AUTH_DEV_AS:-}
      # Cloudflare Access sync and Google Drive archiving are both optional —
      # see README.md. Unset leaves the corresponding feature off.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Unraid's own UI owns 80, and 8080 collides with a lot of community apps.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
